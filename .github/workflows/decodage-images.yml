# Décodage ponctuel : transforme les fichiers « .b64 » envoyés en vraies images,
# puis les supprime. Ce fichier est supprimé juste après son exécution.
name: Decodage des images envoyees

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/decodage-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decodage:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Decodage des images
        shell: bash
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r -d '' f; do
            cible="${f%.b64}"
            base64 -d "$f" > "$cible"
            git add "$cible"
            git rm -q "$f"
            echo "Decode : $cible"
            n=$((n+1))
          done < <(find images fonts -type f -name '*.b64' -print0)
          if [ "$n" -eq 0 ]; then echo "Rien a decoder."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ajout de la photo agents cynophiles"
          git push
