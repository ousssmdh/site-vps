# Rangement ponctuel : remet dans leurs dossiers les images et les polices
# envoyées à la racine du dépôt. Ce fichier est supprimé juste après.
name: Rangement des images et polices

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rangement-fichiers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rangement:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Deplacement des fichiers
        shell: bash
        run: |
          set -euo pipefail
          deplacer() {
            local fichier="$1" dossier="$2"
            if [ -f "$fichier" ]; then
              mkdir -p "$dossier"
              git mv -f "$fichier" "$dossier/$fichier"
              echo "Deplace : $fichier -> $dossier/"
            fi
          }
          for f in marche-nuit.jpg parc-bureaux-nuit.jpg zone-commerciale-nuit.jpg zone-logistique-nuit.jpg; do
            deplacer "$f" images/ambiance
          done
          for f in logo-vps-160.webp logo-vps-800.webp apple-touch-icon.png; do
            deplacer "$f" images/logo
          done
          deplacer vps-partage.jpg images/partage
          for f in geist-latin-wght-normal.woff2 geist-latin-ext-wght-normal.woff2; do
            deplacer "$f" fonts
          done
          if git diff --cached --quiet; then
            echo "Rien a deplacer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rangement des images et polices dans leurs dossiers"
          git push
