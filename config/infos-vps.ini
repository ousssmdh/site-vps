; window.VPS_INFOS = String.raw`
; =====================================================================
;  INFORMATIONS DU SITE VPS – Vigilance Protection Sécurité
; ---------------------------------------------------------------------
;  1. Complétez les valeurs après le signe « = » (une information par ligne).
;  2. Enregistrez le fichier (Ctrl + S).
;  3. Actualisez la page du site dans votre navigateur (touche F5) :
;     les informations s'affichent sur toutes les pages, en français et
;     en anglais. Rien à installer, rien à lancer.
;
;  Rien de confidentiel ici : tout ce que vous écrivez sera visible en ligne.
;  Ne modifiez pas la toute première ni la toute dernière ligne du fichier
;  (lignes techniques) et n'utilisez pas le caractère « accent grave » seul.
; =====================================================================

[site]
; Adresse définitive du site, sans « / » à la fin.
adresse_site = https://www.vps-securite.fr
; « non » tant que le site est en préparation (les moteurs de recherche ne le référencent pas).
; Passez à « oui » le jour de la mise en ligne (README.md, section 9).
indexation = non

[coordonnees]
telephone = 06 03 04 00 78
; >>> SEULE INFORMATION RESTANT À AJOUTER : l'adresse e-mail professionnelle.
; Exemple : contact@vps-securite.fr
email =
zone_intervention = Toute France

[entreprise]
; Facultatif : texte de présentation ajouté sur la page « L'entreprise » (rien ne s'affiche s'il est vide).
; Pour écrire sur plusieurs lignes, commencez chaque ligne suivante par deux espaces.
presentation =
capital_social = 5 000 €
directeur_publication = Saïd Madih, président

[donnees_personnelles]
; Durée de conservation des demandes de devis (durée indiquée par la CNIL pour les données de prospects).
duree_conservation = 3 ans à compter du dernier contact
; Contact pour les questions sur les données personnelles (vous pouvez y mettre votre e-mail).
contact_donnees = VPS, 51 rue Sainte, 13001 Marseille (par courrier)

[mentions_legales]
; Téléphone de l'hébergeur GitHub, Inc.
hebergeur_telephone = +1 877 448 4820
credits_photos = VPS – Vigilance Protection Sécurité
; Date de dernière mise à jour des pages légales (écrite comme : 6 novembre 2026)
date_mise_a_jour = 9 novembre 2026

[formulaire_devis]
; Adresse fournie par le service de réception des formulaires (voir README.md, section 8).
; Tant qu'elle est vide, le formulaire reste inactif et rien ne peut être envoyé.
adresse_reception =
; « ajax » (confirmation affichée sur la page) ou « classique » (page de confirmation du service)
mode_envoi = ajax

[version_anglaise]
; Textes affichés sur les pages anglaises (dossier en/). Une ligne vide reprend le texte français.
; Le téléphone, l'e-mail et l'adresse du formulaire sont communs aux deux langues ;
; la date est traduite automatiquement.
zone_intervention = Throughout France
presentation =
capital_social = €5,000
directeur_publication = Saïd Madih, President
duree_conservation = 3 years from the last contact
contact_donnees = VPS, 51 rue Sainte, 13001 Marseille, France (by post)
credits_photos =
date_mise_a_jour =
; `
